<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>K-Pop Song Search</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header>
      <h1>K-Pop Song Search</h1>
    </header>
    <main>
      <input
        type="text"
        id="search-input"
        placeholder="Search for an artist..."
      />
      <button id="search-button">Search</button>
      <button id="reset-button">Reset</button>

      <section id="featured">
        <h2>Popular K-Pop Artists</h2>
        <div id="carousel"></div>
      </section>

      <section id="artist-box"></section>
      <section id="results"></section>
    </main>
    <script src="script.js"></script>
  </body>
</html>
